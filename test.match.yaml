source:
  adapter: groq
  url: https://jsonplaceholder.typicode.com/posts
  method: GET
  headers: {}
  params: {}

profile:
  name: "Test Post Match"
  description: "Simple test profile for CloudMatchAI v2.0 pipeline"
  fields:
    - id
    - title
    - body
  criteria:
    id: 0.2
    title: 0.4
    body: 0.4

scoring:
  model: gpt-4o-mini
  prompt: |
    You are evaluating how interesting this item is.
    Score from 1 to 10.
    Return JSON: {"score": <number>, "reason": "<short reason>"}.

llm:
  provider: groq
  endpoint: https://api.groq.com/openai/v1
  api_key: ${GROQ_API_KEY}
  model: llama3-70b-8192


storage:
  type: json
  path: test_output.json
