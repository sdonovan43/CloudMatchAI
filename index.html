<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CloudMatchAI — Live Job Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; color: #38bdf8; }
  p.sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  input, select { background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
                  padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
  input { width: 280px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead th { background: #1e293b; padding: 10px 12px; text-align: left;
             color: #94a3b8; font-weight: 600; cursor: pointer; user-select: none; }
  thead th:hover { color: #38bdf8; }
  tbody tr { border-bottom: 1px solid #1e293b; }
  tbody tr:hover { background: #1e293b; }
  td { padding: 10px 12px; vertical-align: top; }
  td a { color: #38bdf8; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
           font-size: 0.75rem; font-weight: 700; color: white; }
  .desc { color: #94a3b8; font-size: 0.8rem; max-width: 340px; }
  .ts { color: #64748b; font-size: 0.8rem; white-space: nowrap; }
  #status { color: #94a3b8; font-size: 0.85rem; margin-bottom: 10px; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #334155;
             border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>☁️ CloudMatchAI</h1>
<p class="sub" id="subtitle">Loading jobs…</p>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search title, company, location…" oninput="filter()">
  <select id="minScore" onchange="filter()">
    <option value="0">All scores</option>
    <option value="30">Score ≥ 30</option>
    <option value="50">Score ≥ 50</option>
    <option value="70">Score ≥ 70</option>
  </select>
  <select id="remoteOnly" onchange="filter()">
    <option value="0">All locations</option>
    <option value="1">Remote only</option>
  </select>
</div>

<div id="status"><span class="spinner"></span> Fetching jobs from Cosmos DB…</div>

<table id="tbl" style="display:none">
  <thead>
    <tr>
      <th onclick="sort(0)">Title ↕</th>
      <th onclick="sort(1)">Company ↕</th>
      <th onclick="sort(2)">Location ↕</th>
      <th onclick="sort(3)">Score ↕</th>
      <th>Snippet</th>
      <th onclick="sort(5)">Date ↕</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
let allJobs = [];
let sortDir = {};

async function loadJobs() {
  try {
    const res = await fetch('/api/jobs');
    if (!res.ok) throw new Error('API error ' + res.status);
    allJobs = await res.json();
    allJobs.sort((a, b) => (b.score || 0) - (a.score || 0));
    document.getElementById('subtitle').textContent =
      `Live feed · ${allJobs.length} total jobs`;
    render(allJobs);
    document.getElementById('tbl').style.display = '';
    document.getElementById('status').textContent = '';
  } catch (e) {
    document.getElementById('status').textContent = '⚠ Could not load jobs: ' + e.message;
  }
}

function badgeColor(score) {
  if (score >= 60) return '#22c55e';
  if (score >= 30) return '#f59e0b';
  return '#6b7280';
}

function render(jobs) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = jobs.map(j => `
    <tr>
      <td><a href="${j.url||'#'}" target="_blank">${j.title||''}</a></td>
      <td>${j.company||''}</td>
      <td>${j.location||''}</td>
      <td><span class="badge" style="background:${badgeColor(j.score||0)}">${j.score||0}</span></td>
      <td class="desc">${(j.description||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').slice(0,200)}</td>
      <td class="ts">${(j.scraped_at||'').slice(0,10)}</td>
    </tr>`).join('');
  document.getElementById('status').textContent = jobs.length + ' jobs shown';
}

function filter() {
  const q = document.getElementById('search').value.toLowerCase();
  const min = parseInt(document.getElementById('minScore').value);
  const remote = document.getElementById('remoteOnly').value === '1';
  const filtered = allJobs.filter(j => {
    const text = `${j.title} ${j.company} ${j.location} ${j.description}`.toLowerCase();
    return text.includes(q)
      && (j.score || 0) >= min
      && (!remote || text.includes('remote'));
  });
  render(filtered);
}

function sort(col) {
  const keys = ['title','company','location','score','description','scraped_at'];
  const key = keys[col];
  sortDir[col] = !sortDir[col];
  allJobs.sort((a, b) => {
    const av = a[key] ?? '', bv = b[key] ?? '';
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return sortDir[col] ? an-bn : bn-an;
    return sortDir[col]
      ? String(av).localeCompare(String(bv))
      : String(bv).localeCompare(String(av));
  });
  filter();
}

loadJobs();
</script>
</body>
</html>
