source:
  adapter: groq
  endpoint: https://api.groq.com/openai/v1/chat/completions

profile:
  name: cloud-provider-eval
  description: Evaluate cloud providers using weighted criteria
  criteria:
    compute: 0.25
    storage: 0.25
    egress: 0.20
    regions: 0.15
    compliance: 0.15

llm:
  provider: groq
  endpoint: https://api.groq.com/openai/v1
  model: llama3-70b-8192
  api_key: ${GROQ_API_KEY}
