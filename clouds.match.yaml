source:
  adapter: "static"
  url: "https://api.example.local/v1/mock-clouds"
  method: "GET"
  headers: {}
  params: {}

profile:
  name: "Enterprise Multi-Cloud Matcher"
  description: "Evaluates standard hyperscaler profiles against weighted architectural metrics."
  criteria:
    compute: 0.40
    storage: 0.30
    egress: 0.10
    regions: 0.20

llm:
  provider: "gemini"
  model: "gemini-2.5-flash"
  api_key: "${GEMINI_API_KEY}"

storage:
  path: "output_clouds.json"