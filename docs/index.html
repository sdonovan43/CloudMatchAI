<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudMatchAI — Scoring Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1c2530;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #7d8590;
    --accent: #58a6ff;
    --good: #3fb950;
    --mid: #d29922;
    --low: #f85149;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 32px 20px 80px;
    min-height: 100vh;
  }

  .wrap { max-width: 860px; margin: 0 auto; }

  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
  }

  .profile-desc {
    color: var(--text-muted);
    font-size: 0.9rem;
    max-width: 560px;
    line-height: 1.5;
  }

  .meta-row {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  #status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-muted);
    padding: 40px 0;
    text-align: center;
  }

  #status.error { color: var(--low); }
  #status .hint {
    display: block;
    margin-top: 8px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 14px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }

  .card:hover { border-color: #444c56; }

  .card-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    cursor: pointer;
  }

  .rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    width: 22px;
    flex-shrink: 0;
  }

  .name-block { flex: 1; min-width: 0; }

  .name { font-weight: 600; font-size: 1.05rem; }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
  }

  .overall {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    flex-shrink: 0;
    min-width: 64px;
    text-align: right;
  }

  .chevron {
    color: var(--text-muted);
    font-size: 0.8rem;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }

  .card.open .chevron { transform: rotate(90deg); }

  .card-body {
    display: none;
    padding: 4px 20px 18px;
    border-top: 1px solid var(--border);
  }

  .card.open .card-body { display: block; }

  .criterion {
    padding: 10px 0;
    border-bottom: 1px solid #21262d;
  }

  .criterion:last-child { border-bottom: none; }

  .crit-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 4px;
  }

  .crit-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--text);
  }

  .crit-score-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: -1px;
    white-space: nowrap;
  }

  .crit-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    width: 34px;
    text-align: right;
  }

  .crit-reasoning {
    color: var(--text-muted);
    font-size: 0.83rem;
    line-height: 1.5;
    margin-top: 2px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty .big { font-size: 2rem; margin-bottom: 8px; }
  .empty code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">CloudMatchAI v2</div>
    <h1 id="profile-title">Scoring Results</h1>
    <p class="profile-desc" id="profile-desc"></p>
    <div class="meta-row" id="meta-row"></div>
  </header>

  <div id="status">
    <span>Loading results.json…</span>
  </div>

  <div id="results"></div>
</div>

<script>
function scoreColor(score) {
  if (score >= 0.75) return 'var(--good)';
  if (score >= 0.45) return 'var(--mid)';
  return 'var(--low)';
}

function makeBar(score) {
  const totalBlocks = 12;
  const filled = Math.round((score || 0) * totalBlocks);
  const empty = totalBlocks - filled;
  return '▓'.repeat(filled) + '░'.repeat(empty);
}

function toggleCard(el) {
  el.classList.toggle('open');
}

function render(items, profileMeta) {
  const resultsEl = document.getElementById('results');
  const statusEl = document.getElementById('status');

  if (!items.length) {
    statusEl.style.display = 'none';
    resultsEl.innerHTML = `
      <div class="empty">
        <div class="big">—</div>
        <div>No entities in this results file.</div>
      </div>`;
    return;
  }

  statusEl.style.display = 'none';

  // Sort by overall_score, descending. Handles either key name defensively.
  const withScores = items.map(item => {
    const analysis = item._match_analysis || {};
    const overall = analysis.overall_score ?? analysis.total_weighted_score ?? analysis.score ?? 0;
    return { item, analysis, overall };
  });
  withScores.sort((a, b) => b.overall - a.overall);

  resultsEl.innerHTML = withScores.map(({ item, analysis, overall }, idx) => {
    const scores = analysis.scores || {};
    const criteriaHtml = Object.keys(scores).length
      ? Object.entries(scores).map(([critName, critData]) => {
          const s = critData.score ?? 0;
          return `
            <div class="criterion">
              <div class="crit-top">
                <span class="crit-name">${critName}</span>
                <div class="crit-score-row">
                  <span class="bar" style="color:${scoreColor(s)}">${makeBar(s)}</span>
                  <span class="crit-score" style="color:${scoreColor(s)}">${s.toFixed(2)}</span>
                </div>
              </div>
              <div class="crit-reasoning">${critData.reasoning || ''}</div>
            </div>`;
        }).join('')
      : `<div class="criterion"><div class="crit-reasoning">${analysis.reasoning || analysis.error || 'No per-criterion breakdown available.'}</div></div>`;

    // Surface any raw fields that aren't the analysis blob, as small meta tags
    const skipKeys = new Set(['_match_analysis', 'name']);
    const tagFields = Object.entries(item).filter(([k]) => !skipKeys.has(k));
    const tagsHtml = tagFields.map(([k, v]) => {
      const display = Array.isArray(v) ? v.join(', ') : String(v);
      return `<span class="tag">${k}: ${display}</span>`;
    }).join('');

    return `
      <div class="card" id="card-${idx}">
        <div class="card-head" onclick="toggleCard(document.getElementById('card-${idx}'))">
          <span class="rank">#${idx + 1}</span>
          <div class="name-block">
            <div class="name">${item.name || 'Unnamed'}</div>
            <div class="tags">${tagsHtml}</div>
          </div>
          <span class="overall" style="color:${scoreColor(overall)}">${overall.toFixed(2)}</span>
          <span class="chevron">▶</span>
        </div>
        <div class="card-body">${criteriaHtml}</div>
      </div>`;
  }).join('');
}

async function load() {
  const statusEl = document.getElementById('status');
  try {
    const res = await fetch('./results.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Optional companion metadata file (profile name/description), safe to skip if absent
    let meta = null;
    try {
      const metaRes = await fetch('./results.meta.json', { cache: 'no-store' });
      if (metaRes.ok) meta = await metaRes.json();
    } catch (_) { /* meta is optional */ }

    if (meta) {
      document.getElementById('profile-title').textContent = meta.name || 'Scoring Results';
      document.getElementById('profile-desc').textContent = meta.description || '';
      if (meta.generated_at) {
        document.getElementById('meta-row').innerHTML =
          `<span>generated: ${meta.generated_at}</span><span>entities: ${data.length}</span>`;
      }
    } else {
      document.getElementById('meta-row').innerHTML = `<span>entities: ${data.length}</span>`;
    }

    render(data, meta);
  } catch (e) {
    statusEl.classList.add('error');
    statusEl.innerHTML = `
      <span>Could not load results: ${e.message}</span>
      <span class="hint">Make sure <code>results.json</code> sits next to this file in the same folder.</span>`;
  }
}

load();
</script>
</body>
</html>
